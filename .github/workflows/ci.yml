name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Arbor.DevPackages.slnx

      - name: Build
        run: dotnet build Arbor.DevPackages.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test Arbor.DevPackages.slnx --no-build --configuration Release --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Threshold=80

      - name: Vulnerability audit
        run: dotnet list Arbor.DevPackages.slnx package --vulnerable --include-transitive
